- id: T-008
  title: 'Fase 3c: erro, cancelamento e respostas obsoletas nos hooks e no detalhe
    de projeto'
  state: done
  notes: 'Parte da Fase 3 (T-003). Depende da T-006 (runner de testes).


    Bugs confirmados por leitura:

    - useSkills e useProjects não têm .catch: uma falha de rede vira unhandled rejection
    e o estado de erro não existe.

    - useProfile e useProjects refazem a busca quando `lang` muda, sem cancelar a
    anterior nem descartar a resposta antiga; a resposta lenta do idioma anterior
    sobrescreve a atual.

    - ProjectsSection.openProject não tem try/catch/finally: se a requisição de detalhe
    falhar, loadingSlug fica preso e o botão daquele card fica desabilitado para sempre.
    Esse é o "recuperação após falha de detalhe" do resultado verificável.


    Contrato acordado para os três hooks: retornar { data, loading, error }. As tarefas
    de UI (T-009) dependem desse formato.


    Nota: o SkillSerializer do backend não traduz nada, então useSkills NÃO deve passar
    a refazer a busca por idioma. Só falta tratamento de erro e cancelamento.


    Arquivos (exclusivos desta tarefa): frontend/src/hooks/useProfile.js, useSkills.js,
    useProjects.js, frontend/src/components/sections/ProjectsSection.jsx.


    Verificação: testes de descarte de resposta obsoleta, de erro de rede em cada
    hook, e de que o botão de case study volta a funcionar depois de uma falha.'
  log:
  - date: '2026-09-06'
    text: Executada por subagente dentro da R-001, com propriedade exclusiva dos três
      hooks e do ProjectsSection.jsx.
  - date: '2026-09-06'
    text: 'Entregue na R-001. 10 testes em src/test/dataHooks.test.jsx, com rodada
      vermelha comprovada antes (9 falhando). A questão do refetch por idioma no useSkills
      foi levantada de novo pelo subagente e ficou resolvida na DEC-003, agora contra
