- id: T-005
  title: 'Migração operacional do backend: Render para Railway'
  state: backlog
  notes: 'docs/superpowers/specs/2026-08-01-portfolio-hardening-design.md, objetivo
    declarado: ''preparar o backend para a migração do Render para a Railway''; seção
    ''Migração operacional'' é explícita que o código só prepara e documenta variáveis,
    sem criar recursos na Railway, copiar arquivos do Render ou mudar DNS, porque
    isso ''exige acesso aos serviços e uma confirmação separada''. Bloqueada até as
    Fases 2-4 estarem prontas, em especial o storage S3 (hoje mídia usa filesystem
    local, que não sobrevive a um deploy novo). É o objetivo final citado no próprio
    design, não escopo inventado por esta tarefa. Feito quando o backend estiver servindo
    na Railway com o mesmo domínio/CORS que hoje aponta para o Render, o storage S3
    validado em produção, e o serviço no Render desligado.'
  created_at: '2026-09-06T12:35:33.655753Z'
  updated_at: '2026-09-06T12:35:33.655753Z'
