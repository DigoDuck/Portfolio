tasks:
- id: T-001
  title: 'Sincronizar o main local com a PR #1 mesclada e limpar a branch de hardening'
  state: done
  notes: 'O main local está parado em e995be7 (''docs: add phase one hardening plan'',
    2026-08-01), 9 commits atrás de origin/main (6ec75f4, merge da PR #1 ''Fix portfolio
    backend production hardening'' em 2026-08-14, confirmado via `gh pr view 1` e
    `git fetch origin`). Por isso o working tree ainda mostra o código pré-hardening:
    backend/apps/portfolio/views.py linha 14 ainda usa a chave ''detaild'' em vez
    de ''detail'', e backend/apps/portfolio/models.py não tem o campo singleton_guard.
    Fazer `git pull` (fast-forward) em main; depois remover a branch local fix/portfolio-hardening-phase-1
    e o worktree .worktrees/phase-1 (visível em `git worktree list`), que já não têm
    uso porque a PR foi mesclada. Feito quando `git log -1 --format=%H` em main aponta
    para 6ec75f4 (ou descendente), `git worktree list` não lista mais phase-1, e a
    chave ''detaild'' não existe mais em views.py.'
  log:
  - date: '2026-09-06'
    text: 'Fechada em 2026-09-06. O `git pull` da PR #1 já tinha sido feito antes
      desta sessão: main estava em 7ca6b53, com singleton_guard em models.py e a chave
      ''detail'' corrigida em views.py. Nesta sessão restava a limpeza, feita: `git
      worktree remove .worktrees/phase-1` (worktree sem alterações pendentes), `git
      branch -d fix/portfolio-hardening-phase-1` (mesclada em main), diretório .worktrees/
      vazio removido, e push do commit local pendente 7ca6b53 (''chore: untrack .mcp.json'')
      para origin/main. Critérios do escopo atendidos: `git worktree list` só lista
      o repo principal, a branch local não existe mais, e ''detaild'' não aparece
      em backend/. Sobra uma pendência fora do critério: a branch remota origin/fix/portfolio-hardening-phase-1
      ainda existe no GitHub, já mesclada; apagar exige confirmação do Diogo. Baseline
      de testes ao fechar: 12 testes do backend passando.'
  created_at: '2026-09-06T12:35:33.655753Z'
  updated_at: '2026-09-06T13:23:34.867199Z'
- id: T-002
  title: 'Fase 2 do design de hardening: storage S3/Railway em produção'
  state: backlog
  notes: docs/superpowers/specs/2026-08-01-portfolio-hardening-design.md, seção 'Fase
    2', pede STORAGES do Django 6 em vez de STATICFILES_STORAGE, WhiteNoise só para
    estáticos, django-storages+S3 para mídia (variáveis AWS_ENDPOINT_URL, AWS_ACCESS_KEY_ID,
    AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET_NAME, AWS_DEFAULT_REGION), FileSystemStorage
    só quando DEBUG=True, URLs assinadas e falha explícita se faltar credencial. backend/requirements.txt
    ainda não tem django-storages (só whitenoise, pillow, psycopg2-binary). Não existe
    nenhum plano nem commit para essa fase; só a Fase 1 tem plano próprio, em docs/superpowers/plans/2026-08-01-portfolio-hardening-phase-1.md.
    É a próxima porque a Fase 1 (pré-requisito de segurança) já está mesclada e o
    objetivo declarado do design é preparar a migração Render -> Railway, que depende
    do storage. Feito quando existir um plano equivalente para a Fase 2 e os testes
    de configuração do 'Resultado verificável' da seção passarem (WhiteNoise para
    staticfiles, filesystem em dev, S3 em produção, falha explícita sem credencial).
  log:
  - date: '2026-09-06'
    text: 'Escopo reduzido em 2026-09-06, ver DEC-001. O primeiro item da Fase 2 (''Substituir
      STATICFILES_STORAGE pela configuração STORAGES do Django 6'' e ''Usar WhiteNoise
      somente para arquivos estáticos'') já está entregue no commit 6db82bb, com teste
      em backend/apps/portfolio/tests/test_storage_settings.py. Era bug ativo, não
      dívida: o Django 6.0 removeu STATICFILES_STORAGE e a produção servia estáticos
      pelo StaticFilesStorage puro, sem hash nem compressão. Restam nesta tarefa:
      adicionar django-storages ao backend/requirements.txt (hoje tem só whitenoise,
      pillow, psycopg2-binary), configurar S3 para mídia por AWS_ENDPOINT_URL / AWS_ACCESS_KEY_ID
      / AWS_SECRET_ACCESS_KEY / AWS_S3_BUCKET_NAME / AWS_DEFAULT_REGION, manter FileSystemStorage
      só com DEBUG=True (o ponto de troca já está explícito em STORAGES[''default'']),
      gerar URLs assinadas, falhar na inicialização de produção quando faltar credencial,
      e documentar as variáveis da Railway mais o procedimento manual de cópia das
      imagens do Render. Bloqueio prático: exige o Railway Bucket criado e as credenciais
      emitidas, o que ainda não aconteceu. Detalhe operacional achado no caminho:
      backend/requirements.txt está salvo em UTF-16 LE com BOM, o que o pip lê sem
      problema (ele detecta BOM) mas atrapalha grep e diff.'
  - date: '2026-09-06'
    text: 'Bloqueada por dependência externa: o bucket de mídia no Railway ainda não
      foi criado, e a criação é do usuário, não de um agente. Não promover para ready
      até o usuário confirmar que o bucket existe e que as credenciais estão nas variáveis
      de ambiente. Ver também a ordem em relação à T-005 (migração Render para Railway),
      ainda não resolvida.'
  created_at: '2026-09-06T12:35:33.655753Z'
  updated_at: '2026-09-06T13:30:21.130384Z'
- id: T-003
  title: 'Fase 3 do design de hardening: contratos e estados do frontend'
  state: review
  notes: 'docs/superpowers/specs/2026-08-01-portfolio-hardening-design.md, seção ''Fase
    3'': consumir photo/bio/seal_text do perfil, corrigir chaves de tradução de case
    study/repositório/demo, mensagens traduzidas de loading e erro, sincronizar idioma
    persistido com i18next e document.documentElement.lang, aplicar tema antes da
    primeira renderização, tratar erro e cancelamento nos hooks de perfil/skills/projetos,
    exigir VITE_API_URL em produção. Nenhum commit ou plano existe para essa fase;
    depende das Fases 1-2 prontas, na ordem em que o design as lista. Feito quando
    existir o plano da Fase 3 e os testes React do ''Resultado verificável'' passarem
    (sincronização de idioma/tema, contrato do perfil, recuperação de falha, descarte
    de respostas obsoletas, build falhando sem VITE_API_URL).'
  log:
  - date: '2026-09-06'
    text: 'Promovida pelo usuário nesta sessão, na frente da T-002. Motivo: a T-002
      depende de um bucket no Railway que ainda não existe, e a Fase 3 é frontend,
      sem acoplamento com a infraestrutura pendente.'
  - date: '2026-09-06'
    text: 'Fase 3 completa na R-001, via T-006 a T-009, todas também em review. Os
      dez itens de escopo da spec foram atendidos e a suíte fecha em 29 testes verdes.


      Deliberadamente NÃO marcada done: o usuário ainda não viu o resultado rodando,
      e nada aqui foi validado num navegador contra o backend de verdade. A verificação
      toda é teste automatizado com axios mockado na fronteira HTTP, mais o build
      de produção nos dois sentidos.


      Ponto que merece o olho do usuário antes do done: o "Sobre mim" passou a preferir
      o campo bio da API sobre o texto local do i18n. Isso é o que a spec pede, mas
      troca o texto visível da página pelo que estiver cadastrado no admin, e os dois
      textos hoje são diferentes.'
  created_at: '2026-09-06T12:35:33.655753Z'
  updated_at: '2026-09-06T13:47:39.254011Z'
- id: T-004
  title: 'Fase 4 do design de hardening: acessibilidade e acabamento do frontend'
  state: backlog
  notes: 'docs/superpowers/specs/2026-08-01-portfolio-hardening-design.md, seção ''Fase
    4'': role=dialog/aria-modal/foco no modal, nomes acessíveis nos controles móveis
    e de tema, prefers-reduced-motion, lazy-load do modal, corrigir a fonte Prompt,
    estilos próprios de Markdown, ESLint cobrindo .js/.jsx, adicionar Vitest + React
    Testing Library + jest-dom + jsdom, remover o EOF literal do .gitignore. frontend/package.json
    confirma: eslint.config.js existe mas devDependencies não tem vitest, @testing-library
    nem jsdom. Última fase do design, depende do frontend já ajustado pela Fase 3.
    Feito quando o plano da Fase 4 existir e os testes de teclado/foco/ARIA/reduced-motion
    passarem, ESLint cobrir .jsx, e o build não emitir mais o aviso da fonte.'
  log:
  - date: '2026-09-06'
    text: 'Dois itens da Fase 4 mudaram de estado durante a execução da Fase 3 (R-001),
      antes de alguém pegar esta tarefa.


      JÁ FEITO, pode riscar do escopo: "Adicionar Vitest, React Testing Library, jest-dom
      e jsdom". Foi puxado para a Fase 3 por necessidade, ver DEC-002. Já existem
      4 arquivos de teste e 29 testes passando, e src/test/setup.js já carrega o jest-dom
      e stuba o IntersectionObserver globalmente.


      CONTINUA NA FASE 4, e é mais grave do que a spec sugere: "Configurar ESLint
      para JavaScript e JSX". Não é acabamento, é uma verificação falsa. O eslint.config.js
      restringe o lint a **/*.{ts,tsx} e o projeto tem ZERO arquivos .ts ou .tsx.
      Medido: `npx eslint src/App.jsx` responde "File ignored because no matching
      configuration was supplied" e `npx eslint . --debug` lista zero arquivos analisados.
      Ou seja, `npm run lint` retorna "No issues found" com exit 0 sem ler uma linha
      de código, e esse comando está na lista de verificação final da spec. Enquanto
      isso não for corrigido, qualquer relatório que cite `npm run lint` como evidência
      está citando nada.'
  created_at: '2026-09-06T12:35:33.655753Z'
  updated_at: '2026-09-06T13:47:31.419215Z'
- id: T-005
  title: 'Migração operacional do backend: Render para Railway'
  state: backlog
  notes: 'docs/superpowers/specs/2026-08-01-portfolio-hardening-design.md, objetivo
    declarado: ''preparar o backend para a migração do Render para a Railway''; seção
    ''Migração operacional'' é explícita que o código só prepara e documenta variáveis,
