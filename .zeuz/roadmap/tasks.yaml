- id: T-014
  title: 'Efeito de hover circular na Stack: letras e ícones ficam vermelhos perto
    do mouse'
  state: review
  role: coding
  notes: 'Pedido do usuário em 2026-09-28: ao aproximar o mouse, um círculo muda a
    cor das letras e dos ícones da Stack para o vermelho de sinal, sem interferir
    no fundo.


    Abordagem: uma cópia da lista com cor text-signal, aria-hidden e pointer-events-none,
    sobreposta e recortada por mask-image radial-gradient centrado no cursor (variáveis
    CSS atualizadas no pointermove, sem re-render do React). O raio anima via @property.
    Só para ponteiro de mouse; em toque não existe hover. A cópia só é montada no
    primeiro hover, para não duplicar o texto no DOM nem nos testes. As réguas da
    cópia ficam transparentes, para só o texto e os ícones mudarem de cor.'
