    Pontos já vistos no código, para a fase de crítica:

    - Duas paletas concorrentes: primary (sky do Tailwind) e brand (beige/blue/navy),
    mais hex soltos (#243a69, #d4cdc5) espalhados nos componentes.

    - As cores da Aurora (#1f93ff, #321986, #0dd7f2) não pertencem a nenhuma das duas
    paletas.

    - As revelações por scroll escondem o conteúdo (opacity 0) até o IntersectionObserver
