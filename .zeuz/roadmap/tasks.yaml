  state: done
  notes: 'Parte da Fase 3 (T-003). Depende da T-006 (runner de testes) e do contrato
    { data, loading, error } da T-008.


    Bugs confirmados contra backend/apps/portfolio/serializers.py:

    - O ProfileSerializer devolve `seal_text`, mas HeroSection lê `profile?.rotating_seal_text`,
    campo que não existe na resposta. O selo giratório sempre cai no fallback "Developer
